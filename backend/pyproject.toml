[project]
name = "kipu-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Roger", email = "contactorogeris@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.6",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.14.3",
    "ultralytics>=8.4.212",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kipu-backend = "kipu_backend:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["slow: usa el modelo YOLO real"]
